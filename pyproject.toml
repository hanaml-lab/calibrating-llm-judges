[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parc"
version = "0.1.0"
description = "Prediction-Powered Audits of Rubric Criteria: valid partial-credit evaluation of long agent runs with calibrated LLM judges"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Manav Agarwal", email = "manav@hanaml.com"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
paper = ["matplotlib>=3.7"]
judge = ["openai>=1.40"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
parc-demo = "parc.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# The report's generator and figure scripts are dense numerical code: compound statements are allowed there,
# and pyflakes still applies.
"paper/*" = ["E401", "E701", "E702", "E731", "E741"]
